services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: investigacion_db
      POSTGRES_USER: ficct
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - /srv/ficct/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ficct -d investigacion_db"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/investigacion_db
      SPRING_DATASOURCE_USERNAME: ficct
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://bshadow.xyz
      APP_UPLOAD_DIR: /app/uploads
      LOCAL_AI_URL: ${LOCAL_AI_URL:-}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-qwen2.5:3b}
      LOCAL_AI_TOKEN: ${LOCAL_AI_TOKEN:-}
      LOCAL_AI_READ_TIMEOUT_MS: 120000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      APP_FIREBASE_CONFIG_PATH: file:/run/secrets/firebase-service-account.json
    volumes:
      - /srv/ficct/data/uploads:/app/uploads
      - /srv/ficct/secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.bshadow.xyz/api
    restart: unless-stopped
    depends_on: [backend]
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    restart: unless-stopped
    user: "0:0"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-web.yml:/etc/cloudflared/config.yml:ro
      - /srv/ficct/secrets:/run/secrets:ro
    depends_on: [frontend, backend]
    networks: [internal]

networks:
  internal:
