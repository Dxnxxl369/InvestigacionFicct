server.port=${PORT:8080}
server.address=0.0.0.0

# Configuracion de PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/investigacion_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin369}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracion JWT
# Clave secreta HMAC-SHA256 en Base64 (minimo 256 bits)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 8 horas de expiracion (en milisegundos: 8 * 60 * 60 * 1000 = 28800000)
jwt.expiration=28800000

# CORS permitido
cors.allowed-origins=*

# Subida de Archivos e Imagenes
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads

# Zona horaria por defecto (Bolivia UTC-4)
spring.jackson.time-zone=America/La_Paz
