server.port=8080

# Configuracion de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/investigacion_db
spring.datasource.username=postgres
spring.datasource.password=admin369
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracion JWT
# Clave secreta HMAC-SHA256 en Base64 (minimo 256 bits)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 8 horas de expiracion (en milisegundos: 8 * 60 * 60 * 1000 = 28800000)
jwt.expiration=28800000

# CORS permitido
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
