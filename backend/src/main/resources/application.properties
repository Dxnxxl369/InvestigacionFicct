server.port=${PORT:8080}
server.address=0.0.0.0

# Inicio ultrarrapido para entornos de baja CPU (Render free tier)
spring.main.lazy-initialization=true

# Configuracion de PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/investigacion_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin369}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Configuracion JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.hbm2ddl.schema_filter_provider=com.ficct.investigacion.config.DocumentosSchemaFilterProvider
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

# Configuracion JWT
# Clave secreta HMAC-SHA256 en Base64 (minimo 256 bits)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 8 horas de expiracion (en milisegundos: 8 * 60 * 60 * 1000 = 28800000)
jwt.expiration=28800000

# CORS permitido
cors.allowed-origins=*

# Subida de Archivos e Imagenes
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
app.upload.dir=uploads

# Configuracion preparada para Amazon S3 (activar con S3_ENABLED=true y credenciales)
app.s3.enabled=${S3_ENABLED:false}
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${S3_REGION:us-east-1}
app.s3.access-key=${AWS_ACCESS_KEY_ID:}
app.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.s3.public-base-url=${S3_PUBLIC_BASE_URL:}

# El módulo de documentos colaborativos se conserva para reactivarlo más adelante.
feature.documentos-colaborativos.enabled=${FEATURE_DOCUMENTOS_COLABORATIVOS_ENABLED:false}

# Configuracion de Firebase Cloud Messaging (FCM)
app.firebase.config-path=classpath:firebase-service-account.json

# Zona horaria por defecto (Bolivia UTC-4)
spring.jackson.time-zone=America/La_Paz

# Importacion opcional de configuraciones locales de desarrollo (ignorado por git)
spring.config.import=optional:classpath:application-local.properties

# Configuracion de Agente IA (Groq prioritario + Fallback automatico a Local PC via Tunel)
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
app.local-ai.url=${LOCAL_AI_URL:}
app.local-ai.model=${LOCAL_AI_MODEL:qwen2.5:3b}
app.local-ai.connect-timeout-ms=${LOCAL_AI_CONNECT_TIMEOUT_MS:2500}
app.local-ai.read-timeout-ms=${LOCAL_AI_READ_TIMEOUT_MS:25000}
